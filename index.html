<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank God I'm Free - C</title>
  <style>
    :root {
      --bg: #111216;
      --top: rgba(18, 19, 24, .90);
      --text: #e8e8ed;
      --muted: #9b9ca4;
      --chip: #2b2c33;
      --line: rgba(255,255,255,.09);
      --grid: #d8d8df;
      --dot: #e3e3e8;
      --dot-text: #292a30;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .pinned {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--top);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(0, 0, 0, .20);
      padding: max(8px, env(safe-area-inset-top)) 8px 8px;
    }

    .shape-strip {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 6px 3px 2px;
      scroll-snap-type: x proximity;
    }

    .shape-strip::-webkit-scrollbar {
      display: none;
    }

    .shape {
      flex: 0 0 94px;
      text-align: center;
      scroll-snap-align: start;
      overflow: visible;
    }

    .shape h3 {
      margin: 0 0 2px;
      font-size: 15px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .diagram {
      --left: 10px;
      --top-grid: 21px;
      --w: 70px;
      --h: 74px;
      --string-step: calc(var(--w) / 5);
      --fret-step: calc(var(--h) / 4);

      width: 88px;
      height: 100px;
      margin: 0 auto;
      position: relative;
      color: var(--grid);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: visible;
    }

    .grid {
      position: absolute;
      left: var(--left);
      top: var(--top-grid);
      width: var(--w);
      height: var(--h);
      border: 2px solid var(--grid);
    }

    .grid::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          transparent calc(20% - 1px), var(--grid) calc(20% - 1px), var(--grid) calc(20% + 1px), transparent calc(20% + 1px),
          transparent calc(40% - 1px), var(--grid) calc(40% - 1px), var(--grid) calc(40% + 1px), transparent calc(40% + 1px),
          transparent calc(60% - 1px), var(--grid) calc(60% - 1px), var(--grid) calc(60% + 1px), transparent calc(60% + 1px),
          transparent calc(80% - 1px), var(--grid) calc(80% - 1px), var(--grid) calc(80% + 1px), transparent calc(80% + 1px)
        ),
        linear-gradient(to bottom,
          transparent calc(25% - 1px), var(--grid) calc(25% - 1px), var(--grid) calc(25% + 1px), transparent calc(25% + 1px),
          transparent calc(50% - 1px), var(--grid) calc(50% - 1px), var(--grid) calc(50% + 1px), transparent calc(50% + 1px),
          transparent calc(75% - 1px), var(--grid) calc(75% - 1px), var(--grid) calc(75% + 1px), transparent calc(75% + 1px)
        );
    }

    .xo {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 19px;
      color: var(--grid);
      line-height: 1;
      font-weight: 600;
    }

    .s0 { left: calc(var(--left) + 0 * var(--string-step)); }
    .s1 { left: calc(var(--left) + 1 * var(--string-step)); }
    .s2 { left: calc(var(--left) + 2 * var(--string-step)); }
    .s3 { left: calc(var(--left) + 3 * var(--string-step)); }
    .s4 { left: calc(var(--left) + 4 * var(--string-step)); }
    .s5 { left: calc(var(--left) + 5 * var(--string-step)); }

    .fret-label {
      position: absolute;
      left: calc(var(--left) + var(--w) + 10px);
      top: calc(var(--top-grid) + 6px);
      color: var(--grid);
      font-size: 11px;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .dot {
      position: absolute;
      left: calc(var(--left) + (var(--s) * var(--string-step)));
      top: calc(var(--top-grid) + ((var(--f) - .5) * var(--fret-step)));
      width: 15px;
      height: 15px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--dot);
      color: var(--dot-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 950;
      line-height: 1;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
    }

    .content {
      padding: 10px 18px 100px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(15px, 4.05vw, 24px);
      line-height: 1.12;
    }

    .section {
      margin: 20px 0 5px;
      color: var(--text);
      font-size: 1.02em;
    }

    .songline {
      position: relative;
      min-height: 45px;
      margin: 0 0 7px;
      padding-top: 22px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .songline.no-chords {
      min-height: 1.18em;
      margin: 0 0 7px;
      padding-top: 0;
    }

    .songline.empty {
      min-height: 28px;
      margin: 0 0 2px;
      padding-top: 17px;
    }

    .chord {
      position: absolute;
      top: 0;
      left: calc(var(--x) * .84ch);
      background: var(--chip);
      color: #d6d7dd;
      border-radius: 4px;
      padding: 0 3px 1px;
      font-weight: 900;
      font-size: .68em;
      line-height: .98;
      white-space: nowrap;
    }

    .cue {
      color: var(--muted);
      font-size: .82em;
    }

    .editline {
      display: inline-block;
      min-width: 12ch;
      color: var(--text);
      outline: 0;
      border-bottom: 1px dotted rgba(255,255,255,.14);
    }

    .editline:focus {
      border-bottom-color: rgba(255,255,255,.45);
    }

    @media (max-width: 390px) {
      .shape {
        flex-basis: 88px;
      }

      .diagram {
        --w: 66px;
        --h: 70px;
        width: 88px;
        height: 96px;

      .content {
        padding-inline: 14px;

      }

      .dot {

        height: 14px;
        font-size: 8.5px;

      .songline {

      .songline.no-chords {

      .songline.empty {

    /* Layout pass: no giant top chord garage. Each song section gets its own local chord bank. */
    .pinned { display: none; }

    .content {

    @media (max-width: 560px) {

    [hidden] {

    .app-header {

    .menu-icon span {

    .song-title {

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;

      letter-spacing: 0;

    .menu-backdrop {
      position: fixed;
      inset: 0;

    .song-menu {

      z-index: 100;
      top: calc(max(8px, env(safe-area-inset-top)) + 52px);

    .song-menu button {

    }

    /* Latest pass: section markers go back in the lyric flow, chord banks scroll normally, and diagrams are readable by human eyes. */
    .content {

    function renderShape(shape) {
      const playedStrings = new Set(shape.dots.map(d => d[0]));
      const muted = new Set(shape.muted || []);
      const open = new Set(shape.open || []);
      let xo = "";
      for (let s = 0; s < 6; s++) {
        if (muted.has(s) || (!playedStrings.has(s) && !open.has(s))) {
          xo += `<span class="xo s${s}">×</span>`;
        } else if (open.has(s)) {
          xo += `<span class="xo s${s}">○</span>`;
        }
      }

      const dots = shape.dots.map(([string, fret, finger]) => {
        const f = fret - shape.start + 1;
        return `<span class="dot" style="--s:${string};--f:${f}">${finger}</span>`;
      }).join("");

      return `
        <div class="shape">
          <h3>${shape.name}</h3>
          <div class="diagram">
            ${xo}
            <div class="grid"></div>
            <span class="fret-label">${shape.start}</span>
            ${dots}
          </div>
        </div>
      `;
    }

    function normalizeThankGodChordName(name, sectionName = "", cue = "") {
      if (sectionName === "Bridge" && name === "Esus4") return "Fsus2/C";
      if (sectionName === "Outro" && name === "Esus2") return "F/C";
      if (sectionName === "Final Chorus" && cue.includes("My sin is gone")) {
        if (name === "A") return "F";
        if (name === "E/G#") return "E";
      }
      if (sectionName === "Intro" && cue.includes("We thank You")) {
        if (name === "E") return "F";
        if (name === "Esus2") return "E";
      }

      const chordNameMap = {
        "E/G#": "C/E",
        "Asus2": "Csus4",
        "A": "F",
        "E": "C",
        "Esus2": "Csus2",
        "Esus4": "Csus4",
        "C#m7": "Am7",
        "B": "G",
        "E/B": "C",
        "B/E": "G/C",
        "B/D#": "G/B",
        "F#m7": "Dm7",
        "Emaj7": "Cmaj7"
      };

      return chordNameMap[name] || name;
    }

    function normalizeChordName(name, sectionName = "", cue = "") {
      return activeSong.normalize(name, sectionName, cue);
    }

    function getShapeSignature(shape) {
      return JSON.stringify({
        start: shape.start,
        muted: [...(shape.muted || [])].sort(),
        open: [...(shape.open || [])].sort(),
        dots: shape.dots.map(dot => dot.join(":")).sort()
      });
    }

    function getSectionChordNames(section) {
      const seen = new Set();
      const names = [];
      section.rows.forEach(row => {
        row.chords.forEach(([, rawName]) => {
          const name = normalizeChordName(rawName, section.section, row.cue);
          if (name !== "N.C." && !seen.has(name)) {
            seen.add(name);
            names.push(name);
          }
        });
      });
      return names;
    }

    function renderSectionChordBank(section) {
      const names = getSectionChordNames(section);
      const seenShapes = new Set();
      return names.map(name => {
        const shape = activeSong.chordShapes.find(s => s.name === name);
        if (!shape) return `<div class="shape missing-shape"><h3>${name}</h3></div>`;
        const signature = getShapeSignature(shape);
        if (seenShapes.has(signature)) return "";
        seenShapes.add(signature);
        return renderShape(shape);
      }).join("");
    }

    function renderChart() {
      const html = activeSong.chart.map(section => {
        const rows = section.rows.map(row => {
          const rowClasses = ["songline"];
          if (!row.chords.length) rowClasses.push("no-chords");
          if (!row.cue.trim()) rowClasses.push("empty");

          const chords = row.chords.map(([x, name]) => {
            const displayName = normalizeChordName(name, section.section, row.cue);
            return `<span class="chord" style="--x:${x}">${displayName}</span>`;
          }).join("");

          return `<div class="${rowClasses.join(" ")}">${chords}<span class="editline" contenteditable="true" spellcheck="false">${row.cue}</span></div>`;
        }).join("");

        return `<section class="section-block">
          <aside class="section-side">
            <div class="section-title">[${section.section}]</div>
            <div class="section-chords">${renderSectionChordBank(section)}</div>
          </aside>
          <div class="section-body">
            <div class="section-title">[${section.section}]</div>${rows}
          </div>
        </section>`;
      }).join("");

      document.getElementById("chart").innerHTML = html;
    }

      try {
        const saved = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
        [...document.querySelectorAll(".editline")].forEach((el, index) => {

    }

    function saveEdits() {
      const lines = [...document.querySelectorAll(".editline")].map(el => el.textContent);
      localStorage.setItem(getStorageKey(), JSON.stringify(lines));
    }

    function renderSongMenu() {

    }

    function openMenu() {
      songMenu.hidden = false;
      menuBackdrop.hidden = false;
      menuButton.setAttribute("aria-expanded", "true");
    }

      songMenu.hidden = true;
      menuBackdrop.hidden = true;
      menuButton.setAttribute("aria-expanded", "false");
    }

      activeSong = songs.find(song => song.id === songId) || songs[0];
      document.title = activeSong.title;
      songTitleEl.textContent = activeSong.title;
      renderSongMenu();
      renderChart();
      loadEdits();
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      closeMenu();
    }
