  <style>
    :root {
      --bg: #111216;
      --top: rgba(18, 19, 24, .90);
      --text: #e8e8ed;
      --muted: #9b9ca4;
      --chip: #2b2c33;
      --line: rgba(255,255,255,.09);
      --grid: #d8d8df;
      --dot: #e3e3e8;
      --dot-text: #292a30;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .pinned {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--top);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(0, 0, 0, .20);
      padding: max(8px, env(safe-area-inset-top)) 8px 8px;
    }

    .shape-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 2px 3px;
      scroll-snap-type: x proximity;
    }

    .shape-strip::-webkit-scrollbar {
      display: none;
    }

    .shape {
      flex: 0 0 95px;
      text-align: center;
      scroll-snap-align: start;
    }

    .shape h3 {
      margin: 0 0 3px;
      font-size: 17px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .diagram {
      --left: 11px;
      --top-grid: 22px;
      --w: 72px;
      --h: 76px;
      --string-step: calc(var(--w) / 5);
      --fret-step: calc(var(--h) / 4);

      width: 96px;
      height: 106px;
      margin: 0 auto;
      position: relative;
      color: var(--grid);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: visible;
    }

    .grid {
      position: absolute;
      left: var(--left);
      top: var(--top-grid);
      width: var(--w);
      height: var(--h);
      border: 2px solid var(--grid);
    }

    .grid::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          transparent calc(20% - 1px), var(--grid) calc(20% - 1px), var(--grid) calc(20% + 1px), transparent calc(20% + 1px),
          transparent calc(40% - 1px), var(--grid) calc(40% - 1px), var(--grid) calc(40% + 1px), transparent calc(40% + 1px),
          transparent calc(60% - 1px), var(--grid) calc(60% - 1px), var(--grid) calc(60% + 1px), transparent calc(60% + 1px),
          transparent calc(80% - 1px), var(--grid) calc(80% - 1px), var(--grid) calc(80% + 1px), transparent calc(80% + 1px)
        ),
        linear-gradient(to bottom,
          transparent calc(25% - 1px), var(--grid) calc(25% - 1px), var(--grid) calc(25% + 1px), transparent calc(25% + 1px),
          transparent calc(50% - 1px), var(--grid) calc(50% - 1px), var(--grid) calc(50% + 1px), transparent calc(50% + 1px),
          transparent calc(75% - 1px), var(--grid) calc(75% - 1px), var(--grid) calc(75% + 1px), transparent calc(75% + 1px)
        );
    }

    .xo {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 19px;
      color: var(--grid);
      line-height: 1;
      font-weight: 600;
    }

    .s0 { left: calc(var(--left) + 0 * var(--string-step)); }
    .s1 { left: calc(var(--left) + 1 * var(--string-step)); }
    .s2 { left: calc(var(--left) + 2 * var(--string-step)); }
    .s3 { left: calc(var(--left) + 3 * var(--string-step)); }
    .s4 { left: calc(var(--left) + 4 * var(--string-step)); }
    .s5 { left: calc(var(--left) + 5 * var(--string-step)); }

    .fret-label {
      position: absolute;
      left: calc(var(--left) + var(--w) + 6px);
      top: calc(var(--top-grid) + 7px);
      color: var(--grid);
      font-size: 13px;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .dot {
      position: absolute;
      left: calc(var(--left) + (var(--s) * var(--string-step)));
      top: calc(var(--top-grid) + ((var(--f) - .5) * var(--fret-step)));
      width: 20px;
      height: 20px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--dot);
      color: var(--dot-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .16);
    }

    .content {
      padding: 16px 18px 100px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(15px, 4.1vw, 24px);
      line-height: 1.18;
    }

    .section {
      margin: 30px 0 10px;
      color: var(--text);
      font-size: 1.05em;
    }

    .songline {
      position: relative;
      min-height: 52px;
      margin: 4px 0 16px;
      padding-top: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chord {
      position: absolute;
      top: 0;
      left: calc(var(--x) * .86ch);
      background: var(--chip);
      color: #d6d7dd;
      border-radius: 5px;
      padding: 1px 5px 2px;
      font-weight: 900;
      font-size: .80em;
      line-height: 1.05;
      white-space: nowrap;
    }

    .cue {
      color: var(--muted);
      font-size: .82em;
    }

    .editline {
      display: inline-block;
      min-width: 12ch;
      color: var(--text);
      outline: 0;
      border-bottom: 1px dotted rgba(255,255,255,.14);
    }

    .editline:focus {
      border-bottom-color: rgba(255,255,255,.45);
    }

    @media (max-width: 390px) {
      .shape {
        flex-basis: 90px;
      }

      .diagram {
        --w: 68px;
        --h: 72px;
        width: 90px;
        height: 102px;
      }

      .content {
        padding-inline: 14px;
        font-size: 14px;
      }

      .dot {
        width: 18px;
        height: 18px;
        font-size: 11px;
      }
    }

    @media (min-width: 720px) {
      .shape {
        flex-basis: 112px;
      }

        --w: 82px;
        --h: 84px;
        width: 110px;
        height: 116px;
      }

      .content {
        padding-inline: 34px;
      }
    }
  </style>
</head>

    function renderShape(shape) {
      const playedStrings = new Set(shape.dots.map(d => d[0]));
      const muted = new Set(shape.muted || []);
      const open = new Set(shape.open || []);
      let xo = "";
      for (let s = 0; s < 6; s++) {
        if (muted.has(s) || (!playedStrings.has(s) && !open.has(s))) {
          xo += `<span class="xo s${s}">×</span>`;
        } else if (open.has(s)) {
          xo += `<span class="xo s${s}">○</span>`;
        }
      }

      const dots = shape.dots.map(([string, fret, finger]) => {
        const f = fret - shape.start + 1;
        return `<span class="dot" style="--s:${string};--f:${f}">${finger}</span>`;
      }).join("");

      return `
        <div class="shape">
          <h3>${shape.name}</h3>
          <div class="diagram">
            ${xo}
            <div class="grid"></div>
            <span class="fret-label">${shape.start}</span>
            ${dots}
          </div>
        </div>
      `;
    }

    function renderChart() {
      const html = chart.map(section => {
        const rows = section.rows.map(row => {
          const chords = row.chords.map(([x, name]) => {
            const displayName = name === "A" ? "Asus2" : name;
            return `<span class="chord" style="--x:${x}">${displayName}</span>`;
          }).join("");

          return `
            <div class="songline">
              ${chords}
              <span class="editline" contenteditable="true" spellcheck="false">${row.cue}</span>
            </div>
          `;
        }).join("");

        return `<div class="section">[${section.section}]</div>${rows}`;
      }).join("");

      document.getElementById("chart").innerHTML = html;
    }

    document.getElementById("shapeStrip").innerHTML = chordShapes.map(renderShape).join("");
    renderChart();

    // Persist edits locally. Tiny mercy in this collapsing civilization.
    const storageKey = "high-voicing-chart-edits-v2";
    const chartEl = document.getElementById("chart");

    function loadEdits() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        [...document.querySelectorAll(".editline")].forEach((el, index) => {
          if (saved[index]) el.textContent = saved[index];
        });
      } catch {}
    }

    function saveEdits() {
      const lines = [...document.querySelectorAll(".editline")].map(el => el.textContent);
      localStorage.setItem(storageKey, JSON.stringify(lines));
    }

    chartEl.addEventListener("input", saveEdits);
    loadEdits();
  </script>
