<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Thank God I'm Free - High Voicings</title>
  <style>
    :root {
      --bg: #111216;
      --top: rgba(18, 19, 24, .90);
      --text: #e8e8ed;
      --muted: #9b9ca4;
      --chip: #2b2c33;
      --line: rgba(255,255,255,.09);
      --grid: #d8d8df;
      --dot: #e3e3e8;
      --dot-text: #292a30;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    .pinned {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--top);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(0, 0, 0, .20);
      padding: max(8px, env(safe-area-inset-top)) 8px 8px;
    }

    .shape-strip {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 6px 3px 2px;
      scroll-snap-type: x proximity;
    }

    .shape-strip::-webkit-scrollbar {
      display: none;
    }

    .shape {
      flex: 0 0 94px;
      text-align: center;
      scroll-snap-align: start;
      overflow: visible;
    }

    .shape h3 {
      margin: 0 0 2px;
      font-size: 15px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .diagram {
      --left: 10px;
      --top-grid: 21px;
      --w: 70px;
      --h: 74px;
      --string-step: calc(var(--w) / 5);
      --fret-step: calc(var(--h) / 4);

      width: 88px;
      height: 100px;
      margin: 0 auto;
      position: relative;
      color: var(--grid);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: visible;
    }

    .grid {
      position: absolute;
      left: var(--left);
      top: var(--top-grid);
      width: var(--w);
      height: var(--h);
      border: 2px solid var(--grid);
    }

    .grid::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,
          transparent calc(20% - 1px), var(--grid) calc(20% - 1px), var(--grid) calc(20% + 1px), transparent calc(20% + 1px),
          transparent calc(40% - 1px), var(--grid) calc(40% - 1px), var(--grid) calc(40% + 1px), transparent calc(40% + 1px),
          transparent calc(60% - 1px), var(--grid) calc(60% - 1px), var(--grid) calc(60% + 1px), transparent calc(60% + 1px),
          transparent calc(80% - 1px), var(--grid) calc(80% - 1px), var(--grid) calc(80% + 1px), transparent calc(80% + 1px)
        ),
        linear-gradient(to bottom,
          transparent calc(25% - 1px), var(--grid) calc(25% - 1px), var(--grid) calc(25% + 1px), transparent calc(25% + 1px),
          transparent calc(50% - 1px), var(--grid) calc(50% - 1px), var(--grid) calc(50% + 1px), transparent calc(50% + 1px),
          transparent calc(75% - 1px), var(--grid) calc(75% - 1px), var(--grid) calc(75% + 1px), transparent calc(75% + 1px)
        );
    }

    .xo {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 19px;
      color: var(--grid);
      line-height: 1;
      font-weight: 600;
    }

    .s0 { left: calc(var(--left) + 0 * var(--string-step)); }
    .s1 { left: calc(var(--left) + 1 * var(--string-step)); }
    .s2 { left: calc(var(--left) + 2 * var(--string-step)); }
    .s3 { left: calc(var(--left) + 3 * var(--string-step)); }
    .s4 { left: calc(var(--left) + 4 * var(--string-step)); }
    .s5 { left: calc(var(--left) + 5 * var(--string-step)); }

    .fret-label {
      position: absolute;
      left: calc(var(--left) + var(--w) + 10px);
      top: calc(var(--top-grid) + 6px);
      color: var(--grid);
      font-size: 11px;
      line-height: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .dot {
      position: absolute;
      left: calc(var(--left) + (var(--s) * var(--string-step)));
      top: calc(var(--top-grid) + ((var(--f) - .5) * var(--fret-step)));
      width: 15px;
      height: 15px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--dot);
      color: var(--dot-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 950;
      line-height: 1;
      transform: translate(-50%, -50%);
      z-index: 2;
      padding: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
    }

    .content {
      padding: 10px 18px 100px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(15px, 4.05vw, 24px);
      line-height: 1.12;
    }

    .section {
      margin: 20px 0 5px;
      color: var(--text);
      font-size: 1.02em;
    }

    .songline {
      position: relative;
      min-height: 45px;
      margin: 0 0 7px;
      padding-top: 22px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .songline.no-chords {
      min-height: 1.18em;
      margin: 0 0 7px;
      padding-top: 0;
    }

    .songline.empty {
      min-height: 28px;
      margin: 0 0 2px;
      padding-top: 17px;
    }

    .chord {
      position: absolute;
      top: 0;
      left: calc(var(--x) * .84ch);
      background: var(--chip);
      color: #d6d7dd;
      border-radius: 4px;
      padding: 0 3px 1px;
      font-weight: 900;
      font-size: .68em;
      line-height: .98;
      white-space: nowrap;
    }

    .cue {
      color: var(--muted);
      font-size: .82em;
    }

    .editline {
      display: inline-block;
      min-width: 12ch;
      color: var(--text);
      outline: 0;
      border-bottom: 1px dotted rgba(255,255,255,.14);
    }

    .editline:focus {
      border-bottom-color: rgba(255,255,255,.45);
    }

    @media (max-width: 390px) {
      .shape {
        flex-basis: 88px;
      }

      .diagram {
        --w: 66px;
        --h: 70px;
        width: 88px;
        height: 96px;
      }

      .content {
        padding-inline: 14px;
        font-size: 14px;
      }

      .dot {
        width: 14px;
        height: 14px;
        font-size: 8.5px;
      }

      .songline {
        min-height: 42px;
        margin: 0 0 6px;
        padding-top: 20px;
      }

      .songline.no-chords {
        min-height: 1.16em;
        margin: 0 0 6px;
        padding-top: 0;
      }

      .songline.empty {
        min-height: 25px;
        margin: 0 0 2px;
        padding-top: 16px;
      }

      .section {
        margin-top: 18px;
      }

    @media (min-width: 720px) {

      }

        --w: 80px;
        --h: 82px;
        width: 108px;
        height: 108px;
      }

      .content {
        padding-inline: 34px;
      }
    }


    /* Layout pass: no giant top chord garage. Each song section gets its own local chord bank. */
    .pinned { display: none; }

    .content {
      padding: 18px 18px 110px;
      font-size: clamp(15px, 4.05vw, 24px);
      line-height: 1.16;
    }

    .section-block {
      display: grid;
      grid-template-columns: 204px minmax(0, 1fr);
      column-gap: 20px;
      margin: 24px 0 36px;
      align-items: start;
    }

    .section-side {
      position: sticky;
      top: 8px;
      align-self: start;
      padding-top: 2px;
    }

    .section-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 1.02em;
      line-height: 1.05;
      font-weight: 500;
    }

    .section-chords {
      display: grid;
      grid-template-columns: repeat(2, 88px);
      gap: 10px 8px;
      align-items: start;
    }

    .section-chords .shape {
      flex: none;
      width: 88px;
      text-align: left;
      margin: 0;
    }

    .section-chords .shape h3 {
      font-size: 12px;
      margin: 0 0 2px 2px;
    }

    .section-chords .diagram {

      --top-grid: 18px;
      --w: 58px;
      --h: 62px;
      width: 88px;
      height: 80px;
      margin: 0;
    }

    .section-chords .dot {
      width: 13px;
      height: 13px;
      font-size: 7.5px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
    }

    .section-chords .xo {
      font-size: 15px;
    }

    .section-chords .fret-label {
      left: calc(var(--left) + var(--w) + 7px);
      top: calc(var(--top-grid) + 6px);
      font-size: 10px;
    }

    .section-body {
      min-width: 0;
    }

    .section-body .section-title {
      display: none;
    }

    .songline {
      position: relative;
      min-height: 58px;
      margin: 0 0 14px;
      padding-top: 29px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .songline.no-chords {
      min-height: 1.35em;
      margin: 0 0 14px;
      padding-top: 0;
    }

    .songline.empty {
      min-height: 40px;
      margin: 0 0 8px;
      padding-top: 25px;
    }

    .chord {
      top: 2px;
      left: calc(var(--x) * .84ch);
      border-radius: 4px;
      padding: 1px 4px 2px;
      font-size: .70em;
      line-height: 1.02;
    }

    @media (min-width: 820px) {
      .section-block {
        grid-template-columns: 288px minmax(0, 1fr);
        column-gap: 24px;
      }

      .section-chords {
        grid-template-columns: repeat(3, 88px);
      }
    }

    @media (max-width: 560px) {
      .content {
        padding-inline: 14px;
      }

      .section-block {
        display: block;
        margin: 18px 0 28px;
      }

      .section-side {
        position: static;
        margin-bottom: 10px;
      }

      .section-title {
        margin: 0 0 8px;
      }

      .section-chords {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding: 0 0 5px;

      }

        width: 82px;
        height: 80px;

      .section-body .section-title {

      }

      .songline {

        margin-bottom: 10px;
        padding-top: 26px;
      }

      .songline.empty {
        min-height: 34px;
        padding-top: 22px;
      }

    /* Latest pass: section markers go back in the lyric flow, chord banks scroll normally, and diagrams are readable by human eyes. */
    .section-block {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      column-gap: 22px;
      margin: 28px 0 42px;
      align-items: start;
    }

    .section-side {

      --left: 10px;
      --top-grid: 22px;
      --w: 76px;
      --h: 80px;
      width: 112px;
      height: 108px;
      margin: 0;
    }

    .section-chords .dot {
      width: 17px;
      height: 17px;
      font-size: 10px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
    }

    .section-chords .xo {
      font-size: 19px;
    }

    .section-chords .fret-label {
      left: calc(var(--left) + var(--w) + 10px);
      top: calc(var(--top-grid) + 7px);
      font-size: 12px;
    }

    .songline {
      min-height: 61px;
      margin: 0 0 16px;
      padding-top: 31px;
    }

    .songline.no-chords {
      min-height: 1.45em;
      margin: 0 0 16px;
      padding-top: 0;
    }

    .songline.empty {
      min-height: 44px;
      margin: 0 0 10px;
      padding-top: 27px;
    }

    @media (min-width: 880px) {

      }

      }

      .section-body .section-title {
        display: block;

      }

      .section-chords {
        display: flex;

      }

      .section-chords::-webkit-scrollbar {

      }

      .section-chords .shape {
        flex: 0 0 106px;

      }

      .section-chords .shape h3 {

      }

      .section-chords .diagram {

        height: 104px;
      }

      .section-chords .dot {
        width: 16px;
        height: 16px;

      .section-chords .xo {

      .section-chords .fret-label {

      .songline {
        min-height: 58px;
        margin-bottom: 14px;

      .songline.no-chords {

        margin-bottom: 14px;
      }

      .songline.empty {
        min-height: 42px;
        padding-top: 26px;
      }
    }

  </style>
</head>

    function renderShape(shape) {
      const playedStrings = new Set(shape.dots.map(d => d[0]));
      const muted = new Set(shape.muted || []);
      const open = new Set(shape.open || []);
      let xo = "";
      for (let s = 0; s < 6; s++) {
        if (muted.has(s) || (!playedStrings.has(s) && !open.has(s))) {
          xo += `<span class="xo s${s}">×</span>`;
        } else if (open.has(s)) {
          xo += `<span class="xo s${s}">○</span>`;
        }
      }

      const dots = shape.dots.map(([string, fret, finger]) => {
        const f = fret - shape.start + 1;
        return `<span class="dot" style="--s:${string};--f:${f}">${finger}</span>`;
      }).join("");

      return `
        <div class="shape">
          <h3>${shape.name}</h3>
          <div class="diagram">
            ${xo}
            <div class="grid"></div>
            <span class="fret-label">${shape.start}</span>
            ${dots}
          </div>
        </div>
      `;
    }

    function normalizeChordName(name) {
      return name === "A" ? "Asus2" : name;
    }

    function getSectionChordNames(section) {
      const seen = new Set();
      const names = [];
      section.rows.forEach(row => {
        row.chords.forEach(([, rawName]) => {
          const name = normalizeChordName(rawName);
          if (!seen.has(name)) {
            seen.add(name);
            names.push(name);
          }
        });
      });
      return names;
    }

    function renderSectionChordBank(section) {
      const names = getSectionChordNames(section);
      return names.map(name => {
        const shape = chordShapes.find(s => s.name === name);
        return shape ? renderShape(shape) : `<div class="shape missing-shape"><h3>${name}</h3></div>`;
      }).join("");
    }

    function renderChart() {
      const html = chart.map(section => {
        const rows = section.rows.map(row => {
          const rowClasses = ["songline"];
          if (!row.chords.length) rowClasses.push("no-chords");
          if (!row.cue.trim()) rowClasses.push("empty");

          const chords = row.chords.map(([x, name]) => {
            const displayName = normalizeChordName(name);
            return `<span class="chord" style="--x:${x}">${displayName}</span>`;
          }).join("");

          return `<div class="${rowClasses.join(" ")}">${chords}<span class="editline" contenteditable="true" spellcheck="false">${row.cue}</span></div>`;
        }).join("");

        return `<section class="section-block">
          <aside class="section-side">
            <div class="section-title">[${section.section}]</div>
            <div class="section-chords">${renderSectionChordBank(section)}</div>
          </aside>
          <div class="section-body">
            <div class="section-title">[${section.section}]</div>${rows}
          </div>
        </section>`;
      }).join("");

      document.getElementById("chart").innerHTML = html;
    }

    renderChart();

    // Persist edits locally. Tiny mercy in this collapsing civilization.
    const storageKey = "high-voicing-chart-edits-v8-section-markers-big-moving-tabs";
    const chartEl = document.getElementById("chart");

    function loadEdits() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        [...document.querySelectorAll(".editline")].forEach((el, index) => {
          if (saved[index]) el.textContent = saved[index];
        });
      } catch {}
    }

    function saveEdits() {
      const lines = [...document.querySelectorAll(".editline")].map(el => el.textContent);
      localStorage.setItem(storageKey, JSON.stringify(lines));
    }

    chartEl.addEventListener("input", saveEdits);
    loadEdits();
  </script>
